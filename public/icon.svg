<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.2"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="8 12" stroke-opacity="0.4"/>
  
  <!-- Central Smartphone / Multi Screen Symbol -->
  <rect x="156" y="106" width="200" height="300" rx="36" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="14"/>
  
  <!-- Screen Area -->
  <rect x="174" y="146" width="164" height="210" rx="16" fill="#1e293b"/>
  
  <!-- Status pill / notch -->
  <rect x="226" y="124" width="60" height="10" rx="5" fill="#38bdf8"/>
  
  <!-- Micro grid screens -->
  <rect x="186" y="160" width="64" height="85" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
  <rect x="262" y="160" width="64" height="85" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
  <rect x="186" y="255" width="64" height="85" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
  <rect x="262" y="255" width="64" height="85" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>

  <!-- Home Indicator -->
  <circle cx="256" cy="382" r="10" fill="#38bdf8"/>
</svg>
